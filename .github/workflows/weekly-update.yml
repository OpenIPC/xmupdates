name: weekly-update

on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      max_per_run:
        description: 'Max firmwares to download in this run'
        required: false
        default: '25'
      commit_every:
        description: 'Commit archive/index.json every N successful uploads'
        required: false
        default: '5'
      dry_run:
        description: 'Dry run (resolve URLs, no download/upload)'
        required: false
        default: 'false'

concurrency:
  group: xmupdates-cron
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Refresh catalog
        run: python xmupdates.py

      # cctvsp.ru's firmware archive: the seller's own builds, several for
      # device IDs the vendor withdrew (cctvsp.py). Its own step, so a failure
      # of either source leaves the other's refresh committed.
      - name: Refresh cctvsp.ru archive
        if: always()
        run: python cctvsp.py

      # Runs even if one catalog failed to refresh, so partial progress isn't lost.
      - name: Commit catalog if changed
        if: always()
        run: |
          git config user.name  "xmupdates-bot"
          git config user.email "actions@github.com"
          git add items.ipc items.dvr items.portal items.cctvsp
          if git diff --cached --quiet; then
            echo "Catalog unchanged."
          else
            git commit -m "chore: refresh catalog $(date -u +%F)"
            git push
          fi

  download-firmwares:
    # Only reads catalog files already committed to main, and never talks to the
    # catalog host — so a dead catalog host must not block archiving. Still waits
    # for refresh-catalog, still skipped if the workflow is cancelled.
    needs: refresh-catalog
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config user.name  "xmupdates-bot"
          git config user.email "actions@github.com"

      - name: Ensure firmware-archive release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view firmware-archive >/dev/null 2>&1; then
            gh release create firmware-archive \
              --title "Firmware archive" \
              --notes "Mirror of XiongMai firmware binaries. See archive/index.json for the full mapping from catalog id to asset URL."
          fi

      - name: Download missing firmwares
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_PER_RUN: ${{ github.event.inputs.max_per_run || '25' }}
          COMMIT_EVERY: ${{ github.event.inputs.commit_every || '5' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          args=(--max-per-run "$MAX_PER_RUN" --commit-every "$COMMIT_EVERY")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python download_firmwares.py "${args[@]}"

      - name: Push tail commits
        run: git push || true

  push-openipc-org:
    # Tell openipc.org what the archive now holds: its board catalogue offers
    # every stock build per device ID (push_openipc_org.py). Runs after the
    # archive job whatever it managed, since a partial run still changed the
    # index.
    needs: download-firmwares
    # Only a run on main may push: openipc.org takes this token from
    # weekly-update.yml on main alone, and a run dispatched from another
    # branch would be refused.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python push_openipc_org.py
